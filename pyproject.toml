[project]
name = "teklif-sablonu"
version = "1.0.0"
description = "Endemiks şirketleri için teklif hazırlama masaüstü uygulaması"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6,<7.0",
    "reportlab>=4.1,<5.0",
    "openpyxl>=3.1,<4.0",
    "platformdirs>=4.0,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.3",
    "pytest-cov>=5.0",
    "pyinstaller>=6.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
teklif-sablonu = "teklif_sablonu.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
teklif_sablonu = ["config/*.json", "assets/**/*"]

